[package]
name = "ramppulse"
version = "0.6.21"
description = "Airport operations desktop application"
authors = ["RampPulse"]
edition = "2021"

[features]
client-only = []

[lib]
name = "ramppulse_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ramppulse-core = { path = "../rust-core" }
rusqlite = { version = "0.43", features = ["bundled"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
livekit = { version = "0.11", features = ["rustls-tls-native-roots"] }

[patch.crates-io]
# Android main-pipe getter deadlock fix from upstream Wry PR #1904.
wry = { git = "https://github.com/tauri-apps/wry", rev = "b307d51daa6630af4ed3d7bbd22afea110f2c83f" }

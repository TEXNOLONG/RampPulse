[[permission]]
identifier = "allow-rampulse-backend"
description = "Enables the RampPulse desktop and chat backend commands used by the frontend bridge."
commands.allow = [
  "get_preferences",
  "set_startup_view",
  "consume_desktop_startup",
  "realtime_protocol_version",
  "load_airport_data",
  "write_client_diagnostic",
  "read_client_diagnostics",
  "chat_initialize",
  "chat_create_dm",
  "chat_load_messages",
  "chat_send_message",
  "chat_receive_message",
  "chat_mark_read",
  "chat_mark_sent_read",
  "call_emit_signal",
  "native_call_connect",
  "native_call_disconnect",
  "native_call_set_muted"
]

[[permission]]
identifier = "allow-open-secondary-session"
description = "Allows the primary RampPulse window to open an isolated secondary operator session."
commands.allow = ["open_secondary_session"]

<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0A0E17">
  <title>RampPulse · Запуск системы</title>
  <link rel="stylesheet" href="splash.css">
</head>
<body>
  <button class="flight-close" id="splashClose" type="button" aria-label="Закрыть приложение" title="Закрыть приложение">
    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4 4 8 8M12 4l-8 8"/></svg>
  </button>
  <main class="boot-screen video-only show-status" id="desktopSplash" role="status" aria-live="polite" aria-label="Запуск RampPulse">
    <video class="flight-video" autoplay muted loop playsinline preload="auto" poster="assets/airport-login.webp" aria-hidden="true"><source src="assets/oto-splash.webm" type="video/webm"></video>
    <div class="flight-hud" aria-hidden="true"><div class="flight-hud-group"><span>RampPulse / SVO</span><span>55°58′N&nbsp; 037°24′E</span></div><div class="flight-hud-group"><span class="flight-signal">СВЯЗЬ · АКТИВНА</span><span>UTC+03</span></div></div>
    <section class="flight-frame"><div class="flight-brand"><img class="flight-brand-mark" src="/rampulse-logo.png" alt=""/><div><div class="flight-brand-title">RampPulse · ОПЕРАЦИОННЫЙ ЦЕНТР</div><div class="flight-brand-subtitle">АЭРОПОРТОВЫЕ СЛУЖБЫ · UUEE</div></div></div>
    <div class="flight-copy"><span class="flight-kicker" id="desktopBootStatus">PRE-FLIGHT CHECK: Инициализация систем…</span><h1>Операционная смена</h1><p>Запускаем службы и загружаем данные аэропорта</p></div>
    <div class="boot-progress" id="desktopBootBar" role="progressbar" aria-label="Готовность систем" aria-valuemin="0" aria-valuemax="100" aria-valuenow="8"><span id="desktopBootProgress" style="transform:scaleX(.08)"></span></div>
    <div class="boot-stages" aria-hidden="true"><span data-stage="0" class="active">PRE-FLIGHT</span><i></i><span data-stage="1">RADAR</span><i></i><span data-stage="2">CABIN</span><i></i><span data-stage="3">TAKEOFF</span></div>
    <div class="boot-foot"><span>СИСТЕМА <strong>НОРМА</strong></span><span>ДАННЫЕ <strong>ЛОКАЛЬНО</strong></span><span>ЗАГРУЗКА <strong id="desktopBootPercent">08%</strong></span></div></section>
  <script src="splash.js"></script>
</body>
</html>
